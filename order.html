<!DOCTYPE html>
<html>
<head>
    <title>Order - Tasty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <div class="navbar">
        <div class="logo">Tasty</div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="popular.html">Popular</a>
            <a href="order.html">Order</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About Us</a>
        </div>
        <div class="nav-right">
            <span class="icon">&#128722;</span>
            <span class="icon search">&#128269;</span>
            <button class="btn-red">Sign Up</button>
        </div>
    </div>

    <!-- ========== PAGE TITLE ========== -->
    <div class="page-header">
        <h1>Place Your Order</h1>
        <p>Fill the form below and we will get your food ready.</p>
    </div>

    <!-- ========== ORDER FORM ========== -->
    <div class="form-box">
        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="text" placeholder="Enter your phone number">

            <label>Delivery Address</label>
            <input type="text" placeholder="Enter your address">

            <label>Choose Dish</label>
            <select>
                <option>Spicy Salad</option>
                <option>Steak Bowl</option>
                <option>Chinese Platter</option>
                <option>Veg Platter</option>
                <option>Pasta and Spaghetti</option>
                <option>Desserts</option>
                <option>Drinks</option>
            </select>

            <label>Quantity</label>
            <input type="text" placeholder="e.g. 2">

            <label>Any Special Instructions?</label>
            <textarea rows="4" placeholder="Less spicy, no onions, etc."></textarea>

            <button type="submit" class="btn-black">Place Order</button>
        </form>
    </div>

    <!-- ========== FOOTER ========== -->
    <div class="footer">
        <div class="logo">Tasty</div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
            <a href="contact.html">Contact</a>
        </div>
        <p class="copy">Copyright &copy; 2026 Tasty. All rights reserved.</p>
    </div>

</body>
</html>
